url: https://www.oshen.win
host: www.oshen.win
siteType: NexusPHP
icon: 'data:image/png;base64,'
asSource: false
asTarget: true
uploadPath: /upload.php
seedDomSelector: "#top~table:first>tbody>tr:nth-child(6)"
search:
  path: /torrents.php
  imdbOptionKey: "4"
  nameOptionKey: "0"
  params:
    incldead: "0"
    search_area: "{optionKey}"
    search: "{imdb}"
    sort: "5"
    type: desc
  result:
    list: ".torrents>tbody>tr"
    url: '.torrentname td a[href*="details.php?id="]'
    name: '.torrentname td a[href*="details.php?id="]'
    size: "td:nth-child(5)"
name:
  selector: 'input[name="name"]'
subtitle:
  selector: 'input[name="small_descr"]'
description:
  selector: 'textarea[name="descr"]'
# TODO: the raw config cannot show NexusPHP's IMDb input (its `url` key is the page URL); check that `input[name="url"]` exists on the form.
imdb:
  selector: 'input[name="url"][type="text"]'
torrent:
  selector: 'input[name="file"]'
# No Douban, MediaInfo or anonymous-upload fields in the raw config.
# TODO: tags — `tags[4][]` checkboxes collapsed into one entry in the raw config; map them from the real form.
category:
  selector: 'select[name="type"]'
  map:
    movie: "401"
    tv: "402"
    tvPack: "402"
    variety: "403"
    documentary: "404"
    cartoon: "405"
    # MV(音乐视频)
    concert: "406"
    sport: "407"
    # TODO: music mapped to 音乐; there is also 高清音乐 ("408").
    music: "409"
videoCodec:
  selector: 'select[name="codec_sel[4]"]'
  map:
    h264: "1"
    x264: "1"
    vc1: "2"
    xvid: "3"
    mpeg4: "3"
    mpeg2: "4"
    dvd: "4"
    other: "5"
    hevc: "10"
    h265: "10"
    x265: "10"
videoType:
  selector: 'select[name="medium_sel[4]"]'
  map:
    # No separate UHD Blu-ray option.
    uhdbluray: "1"
    bluray: "1"
    hddvd: "2"
    remux: "3"
    hdtv: "5"
    # DVDR
    dvd: "6"
    encode: "7"
    dvdrip: "7"
    cd: "8"
    # TODO: the medium list has no WEB-DL option, so `web` is not mapped; ask the site which option WEB-DL uses.
resolution:
  selector: 'select[name="standard_sel[4]"]'
  map:
    1080p: "1"
    1080i: "2"
    720p: "3"
    576p: "4"
    480p: "4"
    2160p: "5"
team:
  selector: 'select[name="team_sel[4]"]'
  map:
    hds: "1"
    chd: "2"
    mysilu: "3"
    wiki: "4"
    other: "5"
    cmct: "6"
    scsg: "7"
    hdtime: "8"
    pthome: "9"
    oshenpt: "10"
    52pt: "11"

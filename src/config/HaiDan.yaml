url: https://www.haidan.cc
host: www.haidan.cc
siteType: NexusPHP
icon: "data:image/png;base64,"
asSource: false
asTarget: true
uploadPath: /upload.php
seedDomSelector: "#top~table:first>tbody>tr:nth-child(6)"
search:
  path: /torrents.php
  imdbOptionKey: "4"
  nameOptionKey: "0"
  params:
    incldead: "0"
    search_area: "{optionKey}"
    search: "{imdb}"
    sort: "5"
    type: desc
  result:
    list: ".torrents>tbody>tr"
    url: '.torrentname td a[href*="details.php?id="]'
    name: '.torrentname td a[href*="details.php?id="]'
    size: "td:nth-child(5)"
name:
  selector: 'input[name="name"]'
subtitle:
  selector: 'input[name="small_descr"]'
description:
  selector: 'textarea[name="descr"]'
imdb:
  selector: 'input[name="url"][type="text"]'
douban:
  selector: 'input[name="durl"]'
torrent:
  selector: 'input[name="file"]'
# No anonymous-upload checkbox in the raw config; `team_suffix` is a free-text input, so no `team` map.
category:
  selector: 'select[name="type"]'
  map:
    movie: "401"
    tv: "402"
    tvPack: "402"
    documentary: "404"
    concert: "406"
    sport: "407"
    cartoon: "405"
    variety: "403"
    music: "408"
    other: "409"
videoCodec:
  selector: 'select[name="codec_sel"]'
  map:
    h264: "1"
    x264: "1"
    hevc: "11"
    x265: "11"
    h265: "11"
    mpeg2: "4"
    mpeg4: "13"
    vc1: "2"
    xvid: "13"
    dvd: "4"
    other: "5"
audioCodec:
  selector: 'select[name="audiocodec_sel"]'
  map:
    aac: "6"
    ac3: "10"
    dd: "10"
    dd+: "10"
    flac: "1"
    dts: "3"
    truehd: "13"
    lpcm: "11"
    dtshdma: "12"
    atmos: "13"
    dtsx: "12"
    ape: "2"
    mp3: "4"
    other: "7"
videoType:
  selector: 'select[name="medium_sel"]'
  map:
    uhdbluray: "9"
    bluray: "1"
    remux: "3"
    encode: "7"
    web: "11"
    hdtv: "5"
    dvd: "6"
    dvdrip: "7"
resolution:
  selector: 'select[name="standard_sel"]'
  map:
    2160p: "1"
    1080p: "2"
    1080i: "3"
    720p: "4"
    576p: "5"
    480p: "5"

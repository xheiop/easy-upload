url: https://pt.aling.de
host: pt.aling.de
siteType: NexusPHP
icon: 'data:image/png;base64,'
asSource: false
asTarget: true
uploadPath: /upload.php
seedDomSelector: "#top~table:first>tbody>tr:nth-child(6)"
search:
  path: /torrents.php
  imdbOptionKey: "4"
  nameOptionKey: "0"
  params:
    incldead: "0"
    search_area: "{optionKey}"
    search: "{imdb}"
    sort: "5"
    type: desc
  result:
    list: ".torrents>tbody>tr"
    url: '.torrentname td a[href*="details.php?id="]'
    name: '.torrentname td a[href*="details.php?id="]'
    size: "td:nth-child(5)"
name:
  selector: 'input[name="name"]'
subtitle:
  selector: 'input[name="small_descr"]'
description:
  selector: 'textarea[name="descr"]'
# TODO: the raw config cannot show NexusPHP's IMDb input (its `url` key is the page URL); check that `input[name="url"]` exists on the form.
imdb:
  selector: 'input[name="url"][type="text"]'
# PT-Gen field; gets the Douban link, as in Piggo.yaml.
douban:
  selector: 'input[name="pt_gen"]'
mediaInfo:
  selector: 'textarea[name="technical_info"]'
anonymous:
  selector: 'input[name="uplver"]'
torrent:
  selector: 'input[name="file"]'
# TODO: tags — `tags[4][]` checkboxes collapsed into one entry in the raw config; map them from the real form.
category:
  selector: 'select[name="type"]'
  map:
    movie: "401"
    tv: "402"
    tvPack: "402"
    documentary: "404"
    cartoon: "405"
videoCodec:
  selector: 'select[name="codec_sel[4]"]'
  map:
    h264: "1"
    x264: "1"
    hevc: "2"
    h265: "2"
    x265: "2"
    mpeg2: "4"
    dvd: "4"
    vc1: "5"
    # No MPEG-4/Xvid option; these go to Other.
    mpeg4: "6"
    xvid: "6"
    other: "6"
videoType:
  selector: 'select[name="medium_sel[4]"]'
  map:
    # No separate UHD Blu-ray option. "Blu-ray DIY" ("2") is not picked automatically.
    uhdbluray: "1"
    bluray: "1"
    remux: "3"
    hdtv: "4"
    web: "5"
    dvd: "6"
    encode: "7"
    dvdrip: "7"
    other: "8"
resolution:
  selector: 'select[name="standard_sel[4]"]'
  map:
    4320p: "1"
    2160p: "2"
    1080p: "3"
    1080i: "3"
    720p: "4"
    576p: "5"
    480p: "5"
area:
  selector: 'select[name="source_sel[4]"]'
  map:
    CN: "1"
    HK: "2"
    TW: "3"
    JP: "4"
    # TODO: option "5" is labelled 朝鲜; confirm it means Korea.
    KR: "5"
    # 欧米
    US: "10"
    EU: "10"
    OT: "11"
team:
  selector: 'select[name="team_sel[4]"]'
  map:
    aling: "1"
    alingweb: "2"
    other: "3"

url: https://anthelion.me
host: anthelion.me
siteType: gazelle
icon: 'data:image/png;base64,'
asSource: false
asTarget: true
uploadPath: /upload.php
seedDomSelector: ''
search:
  path: /torrents.php
  params:
    searchstr: '{imdb}'
# The film fields (title, year, poster, genres, IMDb ID, description) are
# filled by the site's own TMDb Autofill, which the ANT filler triggers.
description:
  selector: '#release_desc'
imdb:
  selector: '#imdbid'
tmdb:
  selector: '#tmdbid'
mediaInfo:
  selector: '#mediainfo'
screenshots:
  selector: '#screenshots'
anonymous:
  selector: 'input[name="anonymous"]'
torrent:
  selector: '#file'
category:
  selector: '#categories'
  # "1" (Short Film) cannot be told apart from a feature film
  map:
    movie: '0'
    documentary: '0'
    concert: '0'
    cartoon: '0'
    tv: '2'
    tvPack: '2'
# Source, codec, audio, resolution, subtitles, language, edition flags and the
# release group are read from the MediaInfo/BDInfo by the site itself. The
# maps below only fill the dropdowns before that read.
source:
  selector: 'select[name="media"]'
  map:
    uhdbluray: 'BluRay'
    bluray: 'BluRay'
    web: 'WEB'
    dvd: 'DVD'
    hddvd: 'HDDVD'
    hdtv: 'HDTV'
    vhs: 'VHS'
videoCodec:
  selector: 'select[name="codec"]'
  map:
    h264: 'H264'
    x264: 'H264'
    hevc: 'H265'
    h265: 'H265'
    x265: 'H265'
    vc1: 'VC1'
    mpeg2: 'MPEG2'
    xvid: 'Xvid'
audioCodec:
  selector: 'select[name="audioformat"]'
  # atmos and dtsx are left out: the site files them under the core codec
  # (TrueHD/EAC3, DTSMA) and ticks the Atmos flag itself
  map:
    aac: 'AAC'
    ac3: 'AC3'
    dd: 'AC3'
    dd+: 'EAC3'
    flac: 'FLAC'
    dts: 'DTS'
    dtshdma: 'DTSMA'
    truehd: 'TrueHD'
    lpcm: 'PCM'
    wav: 'PCM'
    mp3: 'MP3'
    other: 'Other'
resolution:
  selector: '#ressel'
  map:
    2160p: '2160p'
    1080p: '1080p'
    1080i: '1080i'
    720p: '720p'
    576p: 'SD'
    576i: 'SD'
    480p: 'SD'
    480i: 'SD'

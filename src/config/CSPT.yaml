url: https://cspt.top
host: cspt.top
siteType: NexusPHP
icon: 'data:image/png;base64,'
asSource: false
asTarget: true
uploadPath: /upload.php
seedDomSelector: "#top~table:first>tbody>tr:nth-child(6)"
search:
  path: /torrents.php
  imdbOptionKey: "4"
  nameOptionKey: "0"
  params:
    incldead: "0"
    search_area: "{optionKey}"
    search: "{imdb}"
    sort: "5"
    type: desc
  result:
    list: ".torrents>tbody>tr"
    url: '.torrentname td a[href*="details.php?id="]'
    name: '.torrentname td a[href*="details.php?id="]'
    size: "td:nth-child(5)"
name:
  selector: 'input[name="name"]'
subtitle:
  selector: 'input[name="small_descr"]'
description:
  selector: 'textarea[name="descr"]'
# TODO: the raw config cannot show NexusPHP's IMDb input (its `url` key is the page URL); check that `input[name="url"]` exists on the form.
imdb:
  selector: 'input[name="url"][type="text"]'
# PT-Gen field; gets the Douban link, as in Piggo.yaml.
douban:
  selector: 'input[name="pt_gen"]'
mediaInfo:
  selector: 'textarea[name="technical_info"]'
anonymous:
  selector: 'input[name="uplver"]'
torrent:
  selector: 'input[name="file"]'
# TODO: tags — `tags[4][]` checkboxes collapsed into one entry in the raw config; map them from the real form.
category:
  selector: 'select[name="type"]'
  map:
    movie: "401"
    tv: "402"
    tvPack: "402"
    variety: "403"
    documentary: "404"
    cartoon: "405"
    # MV
    concert: "406"
    sport: "407"
    # HQ音乐
    music: "408"
    other: "409"
videoCodec:
  selector: 'select[name="codec_sel[4]"]'
  map:
    h264: "1"
    x264: "1"
    hevc: "2"
    h265: "2"
    x265: "2"
    vc1: "3"
    mpeg2: "4"
    dvd: "4"
    # No MPEG-4/Xvid option; these go to Other.
    mpeg4: "5"
    xvid: "5"
    other: "5"
audioCodec:
  selector: 'select[name="audiocodec_sel[4]"]'
  map:
    aac: "9"
    ape: "10"
    # TrueHD Atmos
    atmos: "11"
    dd+: "12"
    ac3: "13"
    dd: "13"
    lpcm: "14"
    truehd: "15"
    dtsx: "16"
    dtshdma: "17"
    dts: "18"
    wav: "20"
    mp3: "21"
    flac: "22"
    other: "23"
# The medium dropdown is named `source_sel` on this site.
videoType:
  selector: 'select[name="source_sel[4]"]'
  map:
    bluray: "7"
    uhdbluray: "8"
    remux: "9"
    encode: "10"
    dvdrip: "10"
    web: "11"
    hdtv: "12"
    dvd: "13"
    cd: "14"
    other: "16"
resolution:
  selector: 'select[name="standard_sel[4]"]'
  map:
    480p: "4"
    720p: "5"
    1080p: "6"
    1080i: "6"
    2160p: "7"
    4320p: "8"
    # No 576p option; it goes to Other.
    576p: "9"
team:
  selector: 'select[name="team_sel[4]"]'
  map:
    hds: "1"
    chd: "2"
    mysilu: "3"
    wiki: "4"
    other: "5"
    hspt: "8"
    hsweb: "9"
    mteam: "10"
    tnp: "11"
    tptv: "12"
    mweb: "13"
    qhstudio: "14"
    adweb: "15"
    frds: "16"
    hhweb: "17"
    csweb: "18"
    cspt: "19"
    haresweb: "20"

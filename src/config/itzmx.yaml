url: https://pt.itzmx.com
host: pt.itzmx.com
siteType: NexusPHP
icon: 'data:image/png;base64,'
asSource: false
asTarget: true
uploadPath: /upload.php
seedDomSelector: "#top~table:first>tbody>tr:nth-child(6)"
search:
  path: /torrents.php
  imdbOptionKey: "4"
  nameOptionKey: "0"
  params:
    incldead: "0"
    search_area: "{optionKey}"
    search: "{imdb}"
    sort: "5"
    type: desc
  result:
    list: ".torrents>tbody>tr"
    url: '.torrentname td a[href*="details.php?id="]'
    name: '.torrentname td a[href*="details.php?id="]'
    size: "td:nth-child(5)"
name:
  selector: 'input[name="name"]'
subtitle:
  selector: 'input[name="small_descr"]'
description:
  selector: 'textarea[name="descr"]'
# TODO: the raw config cannot show NexusPHP's IMDb input (its `url` key is the page URL); check that `input[name="url"]` exists on the form.
imdb:
  selector: 'input[name="url"][type="text"]'
torrent:
  selector: 'input[name="file"]'
# The form has no codec, medium, Douban, MediaInfo or anonymous fields.
category:
  selector: 'select[name="type"]'
  map:
    movie: "401"
    tv: "402"
    tvPack: "402"
    cartoon: "405"
    music: "408"
    # TODO: there is also a 蓝光 category ("414"); check whether Blu-ray discs must go there instead of 电影/电视剧.
resolution:
  selector: 'select[name="standard_sel"]'
  map:
    2160p: "3"
    1080p: "1"
    1080i: "1"
    720p: "2"
team:
  selector: 'select[name="team_sel"]'
  map:
    other: "1"

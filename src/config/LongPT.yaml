url: https://longpt.org
host: longpt.org
siteType: NexusPHP
icon: 'data:image/png;base64,'
asSource: false
asTarget: true
uploadPath: /upload.php
seedDomSelector: "#top~table:first>tbody>tr:nth-child(6)"
search:
  path: /torrents.php
  imdbOptionKey: "4"
  nameOptionKey: "0"
  params:
    incldead: "0"
    search_area: "{optionKey}"
    search: "{imdb}"
    sort: "5"
    type: desc
  result:
    list: ".torrents>tbody>tr"
    url: '.torrentname td a[href*="details.php?id="]'
    name: '.torrentname td a[href*="details.php?id="]'
    size: "td:nth-child(5)"
name:
  selector: 'input[name="name"]'
subtitle:
  selector: 'input[name="small_descr"]'
description:
  selector: 'textarea[name="descr"]'
# TODO: the raw config cannot show NexusPHP's IMDb input (its `url` key is the page URL); check that `input[name="url"]` exists on the form.
imdb:
  selector: 'input[name="url"][type="text"]'
mediaInfo:
  selector: 'textarea[name="technical_info"]'
torrent:
  selector: 'input[name="file"]'
# No anonymous-upload checkbox or Douban field in the raw config.
# TODO: tags — `tags[4][]` checkboxes collapsed into one entry in the raw config; map them from the real form.
category:
  selector: 'select[name="type"]'
  map:
    movie: "401"
    tv: "402"
    tvPack: "402"
    variety: "403"
    documentary: "404"
    cartoon: "405"
    # 音乐视频
    concert: "406"
    sport: "407"
    # 音频
    music: "408"
    # TODO: two 其他 options ("409" and "411"); pick the right one for `other`.
videoCodec:
  selector: 'select[name="codec_sel[4]"]'
  map:
    h264: "1"
    x264: "1"
    hevc: "2"
    h265: "2"
    x265: "2"
    vc1: "3"
    mpeg2: "4"
    dvd: "4"
    # No MPEG-4/Xvid option; these go to Other.
    mpeg4: "6"
    xvid: "6"
    other: "6"
audioCodec:
  selector: 'select[name="audiocodec_sel[4]"]'
  map:
    flac: "1"
    ape: "2"
    # DTS-HD MA and DTS:X go to DTS.
    dts: "3"
    dtshdma: "3"
    dtsx: "3"
    mp3: "4"
    aac: "6"
    # The list has no Dolby or PCM options; these go to Other.
    ac3: "7"
    dd: "7"
    dd+: "7"
    truehd: "7"
    atmos: "7"
    lpcm: "7"
    wav: "7"
    other: "7"
videoType:
  selector: 'select[name="medium_sel[4]"]'
  map:
    bluray: "1"
    uhdbluray: "2"
    remux: "3"
    web: "4"
    hdtv: "5"
    dvd: "6"
    encode: "7"
    dvdrip: "7"
    cd: "8"
    other: "10"
resolution:
  selector: 'select[name="standard_sel[4]"]'
  map:
    4320p: "6"
    2160p: "5"
    1080p: "2"
    1080i: "2"
    720p: "3"
    480p: "4"
    # No 576p option; it goes to Other.
    576p: "7"
team:
  selector: 'select[name="team_sel[4]"]'
  map:
    longa: "1"
    longweb: "2"
    longpt: "3"
    wiki: "4"
    rl: "6"
    cmct: "7"
    hhweb: "8"
    other: "5"

name: Lint
on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "eslint.config.mjs"
      - "package.json"
      - ".github/**"
    branches:
      - master
      - dev
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "eslint.config.mjs"
      - "package.json"
      - ".github/**"
    branches:
      - master
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm run lint

name: vitest test
on:
  push:
    paths:
      - "src/**"
    branches:
      - master
      - dev
  pull_request:
    paths:
      - "src/**"
    branches:
      - master
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm run test

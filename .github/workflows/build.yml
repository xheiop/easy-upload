name: script build
on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.js"
    branches:
      - master
      - dev
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.js"
    branches:
      - master
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: easy-upload.user.js
          path: dist
